name: verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - run: mkdir -p .work/ci
      - run: npm ci --ignore-scripts
      - run: set -o pipefail; npm test 2>&1 | tee .work/ci/npm-test.log
      - run: set -o pipefail; cargo test --workspace --locked 2>&1 | tee .work/ci/cargo-test.log
      - run: set -o pipefail; cargo fmt --all -- --check 2>&1 | tee .work/ci/cargo-fmt.log
      - run: set -o pipefail; cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee .work/ci/cargo-clippy.log
      - run: set -o pipefail; npm pack --dry-run --json 2>&1 | tee .work/ci/npm-pack.json
      - name: Upload standalone evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dtr-standalone-evidence
          path: .work/ci/**
          if-no-files-found: warn
          retention-days: 14
